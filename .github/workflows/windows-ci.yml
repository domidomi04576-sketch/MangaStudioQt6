name: Windows build and startup verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-verify:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and expand source package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE\ci\source.part*" | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 source parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { Get-Content -Raw -LiteralPath $_.FullName }) -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'MangaStudioQt6-source.tar.gz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64))
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($hash -ne '4fd54f8971d0aeb7b3de5db21e8f48285e43b77f7d4fcaed1bc94b136f7fc1dc') { throw "Source archive SHA-256 mismatch: $hash" }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\work" | Out-Null
          tar.exe -xzf $archive -C "$env:GITHUB_WORKSPACE\work"
          if ($LASTEXITCODE -ne 0) { throw "source package extraction failed: $LASTEXITCODE" }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\work\source\CMakeLists.txt")) { throw "source package extraction did not produce source\CMakeLists.txt" }

      - name: Download exact Qt 6.11.2 and MinGW 13.1 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'mangastudio-toolchain'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $seven = Join-Path $tools '7zr.exe'
          $qtArchive = Join-Path $tools 'qtbase.7z'
          $mingwArchive = Join-Path $tools 'mingw.7z'
          curl.exe -L --fail --retry 3 -o $seven 'https://github.com/ip7z/7zip/releases/download/26.03/7zr.exe'
          curl.exe -L --fail --retry 3 -o $qtArchive 'https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6112/qt6_6112_mingw/qt.qt6.6112.win64_mingw/6.11.2-0-202608131017qtbase-Windows-Windows_11_24H2-Mingw-Windows-Windows_11_24H2-X86_64.7z'
          curl.exe -L --fail --retry 3 -o $mingwArchive 'https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/tools_mingw1310/qt.tools.win64_mingw1310/13.1.0-202407240918mingw1310.7z'
          $expected = @{
            $seven = 'ad4c82fadcbdf93c03b4fc440f300509c7d60c5c2f4d183e35d9d70d6957037d'
            $qtArchive = '8bbd42aa6b7dbb3ac9c88762bbf6f974e29348054186ef5cb920b105c786d81d'
            $mingwArchive = 'a7b502294a903b64fccd4a41ba39f48d3f6c9a5ece167f0cfaeac920d15b344f'
          }
          foreach ($p in $expected.Keys) {
            $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$p]) { throw "SHA-256 mismatch for $p : $actual" }
          }
          $qt = Join-Path $tools 'qt'
          $mg = Join-Path $tools 'mingw'
          New-Item -ItemType Directory -Force -Path $qt,$mg | Out-Null
          & $seven x -y "-o$qt" $qtArchive | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Qt extraction failed: $LASTEXITCODE" }
          & $seven x -y "-o$mg" $mingwArchive | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "MinGW extraction failed: $LASTEXITCODE" }
          $qmake = Get-ChildItem $qt -Recurse -Filter qmake.exe | Select-Object -First 1 -ExpandProperty FullName
          $gpp = Get-ChildItem $mg -Recurse -Filter g++.exe | Where-Object { $_.FullName -match '\\bin\\g\+\+\.exe$' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $qmake -or -not $gpp) { throw 'Required Qt/MinGW executables were not found after extraction.' }
          $qtRoot = Split-Path (Split-Path $qmake)
          $mingwBin = Split-Path $gpp
          "QT_ROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINGW_BIN=$mingwBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$qtRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$mingwBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Qt root: $qtRoot"
          Write-Host "MinGW bin: $mingwBin"

      - name: Apply final validated RC7.6 fixes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path="$env:GITHUB_WORKSPACE\work\source\src\ui\studio.h"
          $text=Get-Content -Raw -LiteralPath $path
          $nl="`n"
          $old='    scene.clearSelection();' + $nl + '    n->setSelected(true);' + $nl + '    if (k != "panel")' + $nl + '      targetPicker->setCurrentIndex(1);'
          $new='    if (k != "panel" && targetPicker->currentIndex() != 1)' + $nl + '      targetPicker->setCurrentIndex(1);' + $nl + '    scene.clearSelection();' + $nl + '    n->setSelected(true);'
          if (-not $text.Contains($old)) { throw 'placeAsset selection fix target not found' }
          $text=$text.Replace($old,$new)
          [IO.File]::WriteAllText($path,$text,[Text.UTF8Encoding]::new($false))

          $testPath="$env:GITHUB_WORKSPACE\work\source\tests\usability.h"
          $testText=Get-Content -Raw -LiteralPath $testPath
          $testNeedle='  record.origin->setCurrentIndex(1);'
          $testReplacement='  record.origin->setCurrentIndex(1);' + [char]10 + '  record.category->setCurrentText("一枚絵（背景＋人物）");'
          if (-not $testText.Contains($testNeedle)) { throw 'source-record test update target not found' }
          $testText=$testText.Replace($testNeedle,$testReplacement)
          [IO.File]::WriteAllText($testPath,$testText,[Text.UTF8Encoding]::new($false))
      - name: Configure with CMake
        shell: pwsh
        run: |
          $src="$env:GITHUB_WORKSPACE\work\source"
          $build="$env:GITHUB_WORKSPACE\build"
          cmake -S $src -B $build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build application and regression test executable
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\build" --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "$env:GITHUB_WORKSPACE\build" -Filter '*.exe' -Recurse | Format-Table FullName,Length

      - name: Run full regression suite
        id: full_regression
        shell: pwsh
        run: |
          $env:PATH="$env:QT_ROOT\bin;$env:MINGW_BIN;$env:PATH"
          ctest --test-dir "$env:GITHUB_WORKSPACE\build" --output-on-failure --timeout 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diagnose regression crash with GDB
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $env:PATH="$env:QT_ROOT\bin;$env:MINGW_BIN;$env:PATH"
          $gdb=Join-Path $env:MINGW_BIN 'gdb.exe'
          $testExe="$env:GITHUB_WORKSPACE\build\MangaStudioQt6Tests.exe"
          $out="$env:GITHUB_WORKSPACE\build\gdb-test-results"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (-not (Test-Path $gdb)) {
            Write-Warning "gdb.exe not available at $gdb"
            exit 0
          }
          & $gdb -q -batch -ex "set pagination off" -ex "run" -ex "bt 30" -ex "info line *$pc" -ex "thread apply all bt 15" --args $testExe $out
          Write-Host "GDB diagnostic exit code: $LASTEXITCODE"
          exit 0

      - name: Verify hidden startup smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PATH="$env:QT_ROOT\bin;$env:MINGW_BIN;$env:PATH"
          $exe="$env:GITHUB_WORKSPACE\build\MangaStudioQt6.exe"
          $p=Start-Process -FilePath $exe -ArgumentList '--startup-smoke-test' -WorkingDirectory "$env:GITHUB_WORKSPACE\build" -PassThru -Wait
          $code=$p.ExitCode
          Write-Host "startup smoke exit code: $code"
          if ($null -eq $code -or $code -ne 0) { throw "startup smoke test failed with exit code $code" }

      - name: Verify real normal GUI startup and event loop
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PATH="$env:QT_ROOT\bin;$env:MINGW_BIN;$env:PATH"
          $exe="$env:GITHUB_WORKSPACE\build\MangaStudioQt6.exe"
          $p=Start-Process -FilePath $exe -WorkingDirectory "$env:GITHUB_WORKSPACE\build" -PassThru
          try {
            $deadline=(Get-Date).AddSeconds(15)
            $seenWindow=$false
            do {
              Start-Sleep -Milliseconds 500
              $p.Refresh()
              if ($p.HasExited) {
                throw "normal GUI exited before validation; exit code $($p.ExitCode)"
              }
              if ($p.MainWindowHandle -ne 0 -or -not [string]::IsNullOrWhiteSpace($p.MainWindowTitle)) {
                $seenWindow=$true
                break
              }
            } while ((Get-Date) -lt $deadline)
            Write-Host "GUI PID=$($p.Id) Handle=$($p.MainWindowHandle) Title='$($p.MainWindowTitle)'"
            if (-not $seenWindow) { throw 'normal GUI process stayed alive but no main window was observed within 15 seconds.' }
            Start-Sleep -Seconds 2
            $p.Refresh()
            if ($p.HasExited) { throw "normal GUI exited during event-loop soak; exit code $($p.ExitCode)" }
          }
          finally {
            if (-not $p.HasExited) {
              Stop-Process -Id $p.Id -Force
              Wait-Process -Id $p.Id -ErrorAction SilentlyContinue
            }
          }

      - name: Build portable folder
        shell: pwsh
        run: |
          $portable="$env:GITHUB_WORKSPACE\portable\MangaStudioQt6-Portable-v23.6-RC7.6-WindowsVerified"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\build\MangaStudioQt6.exe" "$portable\MangaStudioQt6.exe"
          & "$env:QT_ROOT\bin\windeployqt.exe" --release --no-translations --compiler-runtime "$portable\MangaStudioQt6.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with $LASTEXITCODE" }
          Copy-Item "$env:GITHUB_WORKSPACE\work\source" "$portable\source" -Recurse
          @'
          @echo off
          cd /d "%~dp0"
          start "" "MangaStudioQt6.exe"
          '@ | Set-Content -LiteralPath "$portable\START_MANGA_STUDIO.bat" -Encoding ascii
          @'
          MangaStudioQt6 23.6 RC7.6
          Windows CI verified build.
          Validation: compile + full regression suite + startup smoke test + real normal GUI window/event-loop startup + deployed portable smoke test.
          '@ | Set-Content -LiteralPath "$portable\PORTABLE-READY.txt" -Encoding utf8
          $deployed=Start-Process -FilePath "$portable\MangaStudioQt6.exe" -ArgumentList '--startup-smoke-test' -WorkingDirectory $portable -PassThru -Wait
          $deployedCode=$deployed.ExitCode
          Write-Host "deployed portable smoke exit code: $deployedCode"
          if ($null -eq $deployedCode -or $deployedCode -ne 0) { throw "deployed portable smoke test failed with exit code $deployedCode" }
          Get-ChildItem $portable -Recurse | ForEach-Object { if (-not $_.PSIsContainer) { $_.FullName } } | Out-File "$portable\PACKAGE-FILES.txt" -Encoding utf8

      - name: Zip verified portable build
        shell: pwsh
        run: |
          $folder="$env:GITHUB_WORKSPACE\portable\MangaStudioQt6-Portable-v23.6-RC7.6-WindowsVerified"
          $zip="$env:GITHUB_WORKSPACE\MangaStudioQt6-Portable-v23.6-RC7.6-WindowsVerified.zip"
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  MangaStudioQt6-Portable-v23.6-RC7.6-WindowsVerified.zip" | Set-Content "$zip.sha256.txt" -Encoding ascii
          Write-Host "Portable SHA-256: $hash"

      - name: Upload verified portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaStudioQt6-Portable-v23.6-RC7.6-WindowsVerified
          path: |
            MangaStudioQt6-Portable-v23.6-RC7.6-WindowsVerified.zip
            MangaStudioQt6-Portable-v23.6-RC7.6-WindowsVerified.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30
